<?xml version="1.0" encoding="UTF-8" ?>
<features>
  <emulator name="windows-arcade-loader" features="">
    <cores>
      <core name="windows-arcade-loader" features="">
        <feature name="VIDEO MODE" value="videomode" description="Set the display's resolution. Does not affect the rendering resolution." preset="videomodes">
        </feature>
        <!-- GAMESCOPE: started by the launcher (over the game profile's gamescope settings) -->
        <feature name="GAMESCOPE ENABLE" submenu="GAMESCOPE" value="gamescope" description="Enable GameScope compositor for enhanced game display. Default Off">
          <choice name="Off" value="0" />
          <choice name="On" value="1" />
        </feature>
        <feature name="GAMESCOPE BACKEND" submenu="GAMESCOPE" value="gamescope_backend" description="Choose the GameScope backend. Auto keeps the game profile or GameScope default.">
          <choice name="Auto (Default)" value="auto" />
          <choice name="SDL" value="sdl" />
          <choice name="DRM" value="drm" />
        </feature>
        <feature name="GAME NESTED RESOLUTION" submenu="GAMESCOPE" value="gamescope_nested_resolution" description="Select the game (nested) resolution for GameScope. Default Gamescope Output resolution">
          <choice name="640x480" value="640x480" />
          <choice name="800x600" value="800x600" />
          <choice name="1024x768" value="1024x768" />
          <choice name="960x720" value="960x720" />
          <choice name="1280x720" value="1280x720" />
          <choice name="1440x1080" value="1440x1080" />
          <choice name="1920x1080" value="1920x1080" />
          <choice name="2048x1080" value="2048x1080" />
          <choice name="2560x1440" value="2560x1444" />
          <choice name="3840x2160" value="3840x2160" />
          <choice name="4096x2160" value="4096x2160" />
        </feature>
        <feature name="OUTPUT RESOLUTION" submenu="GAMESCOPE" value="gamescope_output_resolution" description="Select the output resolution for GameScope. Default Current Resolution">
          <choice name="640x480" value="640x480" />
          <choice name="800x600" value="800x600" />
          <choice name="1024x768" value="1024x768" />
          <choice name="960x720" value="960x720" />
          <choice name="1280x720" value="1280x720" />
          <choice name="1440x1080" value="1440x1080" />
          <choice name="1920x1080" value="1920x1080" />
          <choice name="2048x1080" value="2048x1080" />
          <choice name="2560x1440" value="2560x1444" />
          <choice name="3840x2160" value="3840x2160" />
          <choice name="4096x2160" value="4096x2160" />
        </feature>
        <feature name="GAME REFRESH RATE" submenu="GAMESCOPE" value="gamescope_nested_refresh" description="Set the refresh rate (fps) for the game when using GameScope. Default 60Hz">
          <choice name="60Hz" value="60" />
          <choice name="75Hz" value="75" />
          <choice name="120Hz" value="120" />
          <choice name="138Hz" value="138" />
          <choice name="144Hz" value="144" />
          <choice name="150Hz" value="150" />
          <choice name="165Hz" value="165" />
          <choice name="170Hz" value="170" />
          <choice name="175Hz" value="175" />
          <choice name="180Hz" value="180" />
          <choice name="200Hz" value="200" />
          <choice name="240Hz" value="240" />
          <choice name="270Hz" value="270" />
          <choice name="275Hz" value="275" />
          <choice name="280Hz" value="280" />
          <choice name="360Hz" value="360" />
          <choice name="390Hz" value="390" />
          <choice name="480Hz" value="480" />
          <choice name="540Hz" value="540" />
        </feature>
        <feature name="GAMESCOPE SCALER" submenu="GAMESCOPE" value="gamescope_scaler" description="Choose the upscaler type for GameScope. Default stretch">
          <choice name="integer" value="integer" />
          <choice name="fit" value="fit" />
          <choice name="fill" value="fill" />
          <choice name="stretch" value="stretch" />
        </feature>
        <feature name="GAMESCOPE FILTER" submenu="GAMESCOPE" value="gamescope_filter" description="Choose the upscaler filter for GameScope. Default linear">
          <choice name="linear" value="linear" />
          <choice name="nearest" value="nearest" />
          <choice name="fsr" value="fsr" />
          <choice name="nis" value="nis" />
          <choice name="pixel" value="pixel" />
        </feature>
        <feature name="GAMESCOPE SHARPNESS" submenu="GAMESCOPE" value="gamescope_sharpness" description="Set the upscaler sharpness (0 for maximum sharpness, 20 for minimum). Default disabled.">
          <choice name="0" value="0" />
          <choice name="5" value="5" />
          <choice name="10" value="10" />
          <choice name="15" value="15" />
          <choice name="20" value="20" />
        </feature>
        <feature name="GAMESCOPE WINDOWS MODE" submenu="GAMESCOPE" value="gamescope_windows_mode" description="Set windows mode. Default Bordered">
          <choice name="borderless" value="borderless" />
          <choice name="fullscreen" value="fullscreen" />
        </feature>
        <feature name="GAMESCOPE HDR" submenu="GAMESCOPE" value="gamescope_hdr" description="Enable HDR mode in GameScope if supported. Default Off">
          <choice name="Off" value="0" />
          <choice name="On" value="1" />
        </feature>
        <feature name="SDR GAMUT WIDENESS" submenu="GAMESCOPE" value="gamescope_sdr_gamut_wideness" description="Set the 'wideness' of the gamut for SDR content. Default disabled.">
          <choice name="0" value="0" />
          <choice name="0.25" value="0.25" />
          <choice name="0.5" value="0.5" />
          <choice name="0.75" value="0.75" />
          <choice name="1" value="1" />
        </feature>
        <feature name="HDR SDR CONTENT NITS" submenu="GAMESCOPE" value="gamescope_hdr_sdr_content_nits" description="Set the luminance of SDR content in nits. Default: 400nits.">
          <choice name="100" value="100" />
          <choice name="200" value="200" />
          <choice name="300" value="300" />
          <choice name="400" value="400" />
          <choice name="500" value="500" />
          <choice name="600" value="600" />
          <choice name="700" value="700" />
          <choice name="800" value="800" />
          <choice name="900" value="900" />
          <choice name="1000" value="1000" />
        </feature>
        <feature name="HDR ITM ENABLED" submenu="GAMESCOPE" value="gamescope_hdr_itm_enabled" description="Enable SDR→HDR inverse tone mapping. Default: Off.">
          <choice name="Off" value="0" />
          <choice name="On" value="1" />
        </feature>
        <feature name="HDR ITM SDR NITS" submenu="GAMESCOPE" value="gamescope_hdr_itm_sdr_nits" description="Set the luminance (in nits) of SDR content used as input for inverse tone mapping. Default: 100 nits.">
          <choice name="100" value="100" />
          <choice name="200" value="200" />
          <choice name="300" value="300" />
          <choice name="400" value="400" />
          <choice name="500" value="500" />
          <choice name="600" value="600" />
          <choice name="700" value="700" />
          <choice name="800" value="800" />
          <choice name="900" value="900" />
          <choice name="1000" value="1000" />
        </feature>
        <feature name="HDR ITM TARGET NITS" submenu="GAMESCOPE" value="gamescope_hdr_itm_target_nits" description="Set the target luminance (in nits) of the inverse tone mapping process. Default: 1000 nits.">
          <choice name="1000" value="1000" />
          <choice name="2000" value="2000" />
          <choice name="3000" value="3000" />
          <choice name="4000" value="4000" />
          <choice name="5000" value="5000" />
          <choice name="6000" value="6000" />
          <choice name="7000" value="7000" />
          <choice name="8000" value="8000" />
          <choice name="9000" value="9000" />
          <choice name="10000" value="10000" />
        </feature>
        <feature name="GAMESCOPE RESHADE EFFECT" submenu="GAMESCOPE" value="gamescope_reshade_effect" description="Specify a ReShade shader effect to use with GameScope.">
        </feature>
        <feature name="ROTATION (RESHADE BEZEL)" value="wal_reshade" description="Vertical games whose dump ships a ReShade setup (Shikigami no Shiro III, GigaWing Generations, KOF Sky Stage, Super Alpine Racer...): rotate them to the landscape screen with a bezel. Off, the game's own picture (portrait). Default: the game's profile (on).">
          <choice name="On" value="1" />
          <choice name="Off" value="0" />
        </feature>
        <feature name="KEEP ASPECT RATIO" value="keep_aspect_ratio" description="Games whose picture the loader scales to the screen (Gashaaaan, 2.67:1): its aspect kept, black bars. Off, stretched to the whole screen. Default: the game's profile (Gashaaaan: stretched).">
          <choice name="On" value="on" />
          <choice name="Off" value="off" />
        </feature>
        <feature name="RENDERER" value="wal_renderer" description="Direct3D through DXVK (Vulkan) or Wine's own WineD3D (OpenGL). Default: the game's profile.">
          <choice name="DXVK" value="dxvk" />
          <choice name="WineD3D" value="wined3d" />
        </feature>
        <feature name="MOUSE AS GUN" value="wal_mouse_guns" description="Gun games: mice and touchpads aim as guns for the players without a lightgun.">
          <choice name="On (Default)" value="1" />
          <choice name="Off" value="0" />
        </feature>
        <feature name="KEYBOARD" value="wal_keyboard" description="Keyboard controls (5 coin, 1 start, arrows, Ctrl/Alt/Space/Shift buttons, F1 service, F2 test).">
          <choice name="On (Default)" value="1" />
          <choice name="Off" value="0" />
        </feature>
      </core>
    </cores>
  </emulator>
</features>
