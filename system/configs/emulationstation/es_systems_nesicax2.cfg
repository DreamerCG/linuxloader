<?xml version="1.0" encoding="UTF-8"?>
<systemList>
  <system>
    <fullname>NESiCAxLive2</fullname>
    <name>nesicax2</name>
    <manufacturer>Taito</manufacturer>
    <release>2017</release>
    <hardware>arcade</hardware>
    <path>/userdata/roms/nesicax2</path>
    <extension>.pc .wsquashfs .wine .squashfs</extension>
    <command>python /userdata/system/dcg/configgen/run.py %CONTROLLERSCONFIG% -system %SYSTEM% -emulator %EMULATOR% -core %CORE% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
	<platform>arcade</platform>
    <theme>nesicax2</theme>
        <emulators>
            <emulator name="linuxloader-dcg">
                <cores>
                    <core>linuxloader-dcg</core>
                </cores>
            </emulator>
            <emulator name="wine">
                <cores>
                    <core default="true">wine-tkg</core>
                </cores>
            </emulator>				
            <emulator name="windows-arcade-loader">
                <cores>
                    <core default="true">windows-arcade-loader</core>
                </cores>
            </emulator>		
        </emulators>
  </system>
</systemList>
