<?xml version="1.0"?>
<systemList>
  <system>
        <fullname>teknoparrot</fullname>
        <name>teknoparrot</name>
        <manufacturer>Microsoft</manufacturer>
        <release>1992</release>
        <hardware>computer</hardware>
        <path>/userdata/roms/teknoparrot</path>
        <extension>.pc .exe .wine .wsquashfs .wtgz .squashfs .windowsloader</extension>
		<command>python /userdata/system/dcg/configgen/dcglauncher %CONTROLLERSCONFIG% -gameinfoxml %GAMEINFOXML% -system %SYSTEM% -rom %ROM% -emulator %EMULATOR% -systemname %SYSTEMNAME%</command>        
        <platform>windows</platform>
        <theme>teknoparrot</theme>
        <emulators>
            <emulator name="linuxloader-dcg">
                <cores>
                    <core>linuxloader-dcg</core>
                </cores>
            </emulator>
            <emulator name="wine">
                <cores>
                    <core default="true">wine-tkg</core>
                </cores>
            </emulator>
            <emulator name="windows-arcade-loader">
                <cores>
                    <core>windows-arcade-loader</core>
                </cores>
            </emulator>			
        </emulators>
  </system>
</systemList>