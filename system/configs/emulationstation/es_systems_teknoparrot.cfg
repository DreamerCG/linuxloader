<?xml version="1.0"?>
<systemList>
  <system>
        <fullname>teknoparrot</fullname>
        <name>teknoparrot</name>
        <manufacturer>Microsoft</manufacturer>
        <release>1992</release>
        <hardware>computer</hardware>
        <path>/userdata/roms/teknoparrot</path>
        <extension>.wine .wsquashfs .pc .squashfs .windowsloader</extension>
        <command>python /userdata/system/dcg/configgen/run.py %CONTROLLERSCONFIG% -system %SYSTEM% -emulator %EMULATOR% -core %CORE% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
        <platform>arcade</platform>
        <theme>teknoparrot</theme>
        <emulators>
            <emulator name="linuxloader-dcg">
                <cores>
                    <core>linuxloader-dcg</core>
                </cores>
            </emulator>
            <emulator name="wine">
                <cores>
                    <core>wine-tkg</core>
                </cores>
            </emulator>				
            <emulator name="windows-arcade-loader">
                <cores>
                    <core default="true">windows-arcade-loader</core>
                </cores>
            </emulator>		
        </emulators>
  </system>
</systemList>