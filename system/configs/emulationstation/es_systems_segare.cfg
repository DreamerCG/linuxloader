<?xml version="1.0" encoding="UTF-8"?>
<!-- *** es_systems.cfg edited for Batocera by RGS TEAM ***-->
<systemList>
	<system>
		<fullname>Sega RingEdge</fullname>
		<name>segare</name>
		<manufacturer>Sega</manufacturer>
		<release>2009</release>
		<hardware>arcade</hardware>
 		<path>/userdata/roms/segare</path>
		<extension>.pc .wsquashfs .wine .windowsloader .squashfs</extension>
		<command>python /userdata/system/dcg/configgen/run.py %CONTROLLERSCONFIG% -system %SYSTEM% -emulator %EMULATOR% -core %CORE% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
		<platform>arcade</platform>
		<theme>segare</theme>
        <emulators>
            <emulator name="wine">
                <cores>
                    <core >wine-tkg</core>
                </cores>
            </emulator>
            <emulator name="windows-arcade-loader">
                <cores>
                    <core default="true">windows-arcade-loader</core>
                </cores>
            </emulator>
        </emulators>
	</system>
</systemList>
