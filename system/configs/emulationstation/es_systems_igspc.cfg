<?xml version="1.0" encoding="UTF-8"?>
<!-- *** es_systems.cfg edited for Batocera by RGS TEAM ***-->
<systemList>
	<system>
		<fullname>IGS PC</fullname>
		<name>igspc</name>
		<manufacturer>IGS</manufacturer>
		<release>2008</release>
		<hardware>arcade</hardware>
		<path>/userdata/roms/igspc</path>
		<extension>.squashfs</extension>
	    <command>python /userdata/system/dcg/configgen/run.py %CONTROLLERSCONFIG% -system %SYSTEM% -emulator %EMULATOR% -core %CORE% -rom %ROM% -gameinfoxml %GAMEINFOXML% -systemname %SYSTEMNAME%</command>
		<platform>arcade</platform>
		<theme>igspc</theme>
		<emulators>
			<emulator name="linuxloader">
				<cores>
					<core default="true">linuxloader</core>
				</cores>
			</emulator>
		</emulators>
	</system>
</systemList>
