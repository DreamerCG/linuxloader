<?xml version="1.0" encoding="UTF-8" ?>
<features>
  <emulator name="linuxloader" features="padtokeyboard">
    <cores>
      <core name="linuxloader" features="">
        <sharedFeature value="videomode" />
        <sharedFeature value="use_guns" />
        <sharedFeature value="gamescope" />
        <sharedFeature value="gamescope_nested_resolution" />
        <sharedFeature value="gamescope_output_resolution" />
        <sharedFeature value="gamescope_nested_refresh" />
        <sharedFeature value="gamescope_scaler" />
        <sharedFeature value="gamescope_filter" />
        <sharedFeature value="gamescope_sharpness" />
        <sharedFeature value="gamescope_windows_mode" />
        <sharedFeature value="gamescope_hdr" />
        <sharedFeature value="gamescope_sdr_gamut_wideness" />
        <sharedFeature value="gamescope_hdr_sdr_content_nits" />
        <sharedFeature value="gamescope_hdr_itm_enabled" />
        <sharedFeature value="gamescope_hdr_itm_sdr_nits" />
        <sharedFeature value="gamescope_hdr_itm_target_nits" />
        <sharedFeature value="gamescope_reshade_effect" />
        <feature name="ROTATE VERTICAL GAMES" value="linuxloader_rotate" description="Vertical games (Galaga Assault, Pac-Man Chomp Mania): draw the picture rotated, for a screen turned on its side. Off, it is upright with black bars.">
          <choice name="Off (Default)" value="0" />
          <choice name="On" value="1" />
        </feature>
        <feature name="TEST MODE" value="linuxloader_test" description="Start the game in its test (operator) menu.">
          <choice name="Off (Default)" value="0" />
          <choice name="On" value="1" />
        </feature>
      </core>
    </cores>
  </emulator>
</features>
